name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - master

  # Allow manual builds for testing feature branches.
  workflow_dispatch:

permissions: {} # each job gets only the permissions it needs

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      # Fetch the entire Git history so plugins such as
      # jekyll-last-modified-at can inspect commit dates.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true


      - name: Generate Research update date
        shell: bash
        run: |
          updated_at="$(git log -1 --format=%cI -- \
            _pages/research.md \
            _bibliography/references.bib \
            _data/conferences.json)"

          if [ -z "$updated_at" ]; then
            echo "Could not determine Research update date" >&2
            exit 1
          fi

          printf 'last_updated: "%s"\n' "$updated_at" > _data/research_updated.yml

      - name: Test generated-site link checker
        run: python3 -m unittest discover -s tests -v

      - name: Check website-specific JavaScript syntax
        run: node --check assets/js/site-custom.js

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      # Ensure the remote theme, custom JS, and Sass compiler all provided
      # the assets the site expects before publishing the Pages artifact.
      - name: Verify generated frontend assets
        shell: bash
        run: |
          test -s _site/assets/css/main.css
          test -s _site/assets/js/main.min.js
          test -s _site/assets/js/site-custom.js
          test -s _site/index.html

      - name: Validate generated Lunr search index
        shell: bash
        run: |
          test -s _site/assets/js/lunr/lunr-store.js
          node --check _site/assets/js/lunr/lunr-store.js

      - name: Verify local links and browser assets
        run: python3 scripts/check_site.py --root _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
