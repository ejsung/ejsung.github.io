# Eric J. Sung — academic website
# Site-specific settings for the Minimal Mistakes remote theme.
# Keep the theme and the customized _sass tree at the same upstream release.

# Theme and site identity
remote_theme: mmistakes/minimal-mistakes@4.28.1
minimal_mistakes_skin: default
locale: en-US
title: Eric J. Sung
title_separator: '-'
name: Eric J. Sung
description: Eric J. Sung's website.
url: https://ejsung.github.io
baseurl: ''
repository: ejsung/ejsung.github.io
logo: /assets/images/favicon-32x32.png
masthead_title: Eric J. Sung
words_per_minute: 200

# Search and integrations
search: true
search_provider: lunr
lunr:
  search_within_pages: true
analytics:
  provider: false

# Author and footer
author:
  name: Eric J. Sung
  avatar: /assets/images/Eric_Sung_uofa_2023.jpg
  bio: Applied Mathematics PhD student working at the intersection of condensed matter theory, open quantum systems,
    and analog gravity.
  location: Tucson, Arizona
  links:
  - label: Contact
    icon: fas fa-fw fa-envelope-square
    url: /contact/
  - label: Google Scholar
    icon: fab fa-fw fa-google-scholar
    url: https://scholar.google.com/citations?user=wVkCFwwAAAAJ&hl=en
  - label: ORCID
    icon: fab fa-fw fa-orcid
    url: https://orcid.org/0000-0003-4437-1068
  - label: GitHub
    icon: fab fa-fw fa-github
    url: https://github.com/ejsung
  - label: ResearchGate
    icon: fab fa-fw fa-researchgate
    url: https://www.researchgate.net/profile/Eric-Sung-5
  - label: LinkedIn
    icon: fab fa-fw fa-linkedin
    url: https://www.linkedin.com/in/ejsung/
  - label: Bluesky
    icon: fab fa-fw fa-bluesky
    url: https://bsky.app/profile/ejsung.bsky.social
  - label: X (formerly Twitter)
    icon: fab fa-fw fa-square-x-twitter
    url: https://x.com/ejsung555
footer:
  links:
  - label: Bluesky
    icon: fab fa-fw fa-bluesky
    url: https://bsky.app/profile/ejsung.bsky.social
  - label: X
    icon: fab fa-fw fa-square-x-twitter
    url: https://x.com/ejsung555
  - label: GitHub
    icon: fab fa-fw fa-github
    url: https://github.com/ejsung

# Jekyll files and parsing
include:
- .htaccess
- _pages
exclude:
- vendor
- .bundle
- .sass-cache
- Gemfile
- Gemfile.lock
- LICENSE
- node_modules
- /docs
- /test
- scripts
- tests
keep_files:
- .git
- .svn
encoding: utf-8
markdown_ext: markdown,mkdown,mkdn,mkd,md
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
  - import
permalink: /:categories/:title/
timezone: America/Phoenix

# Plugins and archives
plugins:
- jekyll-remote-theme
- jekyll-sitemap
- jekyll-feed
- jekyll-include-cache
- jekyll-last-modified-at
- jekyll/scholar
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
compress_html:
  clippings: all
  ignore:
    envs: development
defaults:
- scope:
    path: ''
    type: posts
  values:
    layout: single
    author_profile: true
    read_time: true
    share: true
    related: true
- scope:
    path: ''
    type: pages
  values:
    layout: single
    author_profile: true

# Jekyll Scholar
scholar:
  style: assets/bibliography/american-physics-society-website.csl
  locale: en
  source: ./_bibliography
  bibliography: references.bib
  sort_by: year
  order: descending
  bibliography_template: bibliography
